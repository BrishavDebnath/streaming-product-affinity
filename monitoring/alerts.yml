# Alert rules, evaluated by Prometheus every 10 s. Firing alerts are listed at
# http://localhost:9090/alerts (there is no Alertmanager in this local setup).
groups:
  - name: streaming-product-affinity
    rules:
      - alert: ApiDown
        expr: up{job="affinity-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "The API has not answered Prometheus for a minute."

      - alert: PipelineStale
        expr: affinity_pipeline_staleness_seconds > 120
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Spark has not saved any result for over 2 minutes."
          description: "Check `docker compose logs spark` and that the producer is running."

      - alert: KafkaLagGrowing
        # Lag is a sawtooth: it climbs between triggers and drops after each
        # batch, so its slope is noise. "Falling behind" means the LOWEST lag
        # of the last 5 minutes is above the HIGHEST of the 5 minutes before.
        expr: >-
          max by (query) (affinity_kafka_lag_offsets) > 1000
          and max by (query) (min_over_time(affinity_kafka_lag_offsets[5m]))
            > max by (query) (max_over_time(affinity_kafka_lag_offsets[5m] offset 5m))
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Spark query {{ $labels.query }} is falling behind Kafka."
          description: "Over 1000 events unread and the backlog keeps rising. Lower the event rate, raise SHUFFLE_PARTITIONS, or give Spark more cores."

      - alert: BatchSlowerThanTrigger
        # 10000 ms is the default TRIGGER_INTERVAL; change both together.
        expr: affinity_batch_duration_ms > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Spark query {{ $labels.query }} takes longer than its trigger interval."

      - alert: StateStoreGrowing
        # Bounded state levels off; steady growth means eviction stopped.
        expr: deriv(affinity_state_rows[15m]) > 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Streaming state for {{ $labels.query }} keeps growing (see ADR 0001)."

      # The learned re-ranker (src/ranking). None of these fire when no model
      # has been trained: score_by=learned then simply answers as affinity.
      - alert: RankerModelStale
        # Seven days is the label window it learns from: past that, a week of
        # traffic it has never seen is being ranked by it.
        expr: affinity_ranker_model_age_seconds > 7 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "The re-ranker ({{ $labels.version }}) is over a week old."
          description: "Retrain it: scripts/train_ranker.py, see README."

      - alert: RankerUnusable
        expr: affinity_ranker_loaded == 1 and affinity_ranker_usable == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "A re-ranker is loaded but does not fit the data being served."
          description: "Its item2vec vectors come from another replay window, or no replay is recorded, so score_by=learned is answering as affinity. The learned_unavailable field of /related-products says which."

      - alert: RankerFallingBack
        expr: rate(affinity_ranker_fallback_total[5m]) > 0 and affinity_ranker_usable == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "score_by=learned keeps falling back to affinity."
