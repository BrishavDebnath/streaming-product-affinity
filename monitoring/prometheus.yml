# Prometheus turns the /metrics snapshot into a time series by scraping it on
# a schedule and keeping the history. Without it you can see the current lag
# but never how it behaved under load.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: affinity-api
    metrics_path: /metrics
    static_configs:
      # The API runs in its own container; Prometheus reaches it by service
      # name on the Compose network.
      - targets: ["api:8000"]
        labels:
          service: affinity
