name: CI

on:
  push:
  pull_request:

# A new push replaces a run still in progress for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961   # v5
        with:
          distribution: temurin
          java-version: '17'          # PySpark 4 needs Java 17 or newer
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Pytest
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Coverage summary
        if: always()
        run: |
          echo '### Coverage (Python ${{ matrix.python }})' >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          print(f"Lines covered: {float(root.get('line-rate', 0)) * 100:.1f}%")
          PY

  stack:
    name: Whole stack end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only on pushes: the run builds every image and produces real events.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS localhost:8000/health | grep -q '"status":"ok"'; then
              echo "API is up after ${i}0 s"; exit 0
            fi
            sleep 10
          done
          echo "API never became healthy"; exit 1
      - name: End-to-end check
        run: docker compose run --rm smoke
      - name: Container logs
        if: failure()
        run: docker compose ps -a && docker compose logs --tail 200
      - name: Stop
        if: always()
        run: docker compose down -v
