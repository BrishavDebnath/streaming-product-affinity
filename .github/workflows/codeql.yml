name: CodeQL

# Static analysis for the Python in this repository: injection, unsafe
# deserialisation, path traversal and the rest of the query pack. Runs on every
# push to main, on pull requests, and weekly - because a query pack updated
# after a merge can find something the merge itself did not.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"          # Mondays, 04:17 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write      # to upload the results
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd   # v4
        with:
          languages: python
          # security-extended adds the lower-precision queries; on a codebase
          # this size the extra noise is manageable and the extra coverage is
          # the point of running it at all.
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd   # v4
        with:
          category: "/language:python"
